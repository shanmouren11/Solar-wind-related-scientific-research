name: solar-jet
# NOTE: keep this file ASCII-only. On Chinese Windows conda decodes YAML with
# GBK and crashes on non-ASCII characters (EnvironmentSpec hook error).
# Channel selection is left to the user's .condarc (e.g. TUNA/USTC mirrors);
# add an explicit "channels:" block here only if you really need it.
dependencies:
  - python=3.11
  # numerics / core astro
  - numpy
  - scipy
  - pandas
  - astropy
  - matplotlib
  # solar physics: search / calibration / field extrapolation
  - sunpy
  - sunpy-soar
  - aiapy
  - pfsspy
  - sunkit-magex
  # imaging & stats
  - scikit-image
  - scikit-learn
  # interactive
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - eispac
